name: Deploy

on:
  workflow_call:
    outputs:
      version-id:
        description: The Worker version published by this run
        value: ${{ jobs.deploy.outputs.version-id }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version-id: ${{ steps.deploy.outputs.version-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v2
        with:
          version: 11.5.2
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Build
        run: pnpm build

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.jsonl
        run: |
          pnpm exec wrangler deploy
          version_id=$(jq -ser 'map(select(.type == "deploy")) | last | .version_id | strings | select(length > 0)' "$WRANGLER_OUTPUT_FILE_PATH")
          echo "version-id=$version_id" >> "$GITHUB_OUTPUT"
