name: Check

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  # Keep production runs alive through rollback before starting the next run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  snapshot:
    name: Save deployed Worker version
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version-id: ${{ steps.snapshot.outputs.version-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v2
        with:
          version: 11.5.2
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Save deployed Worker version
        id: snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler deployments status --json > "$RUNNER_TEMP/deployment.json"
          version_id=$(jq -er '.versions | select(length == 1) | .[0] | select(.percentage == 100) | .version_id | strings | select(length > 0)' "$RUNNER_TEMP/deployment.json")
          echo "version-id=$version_id" >> "$GITHUB_OUTPUT"

  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v2
        with:
          version: 11.5.2
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check Worker types
        run: pnpm exec wrangler types --check

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy
    # Only the snapshot gates deployment; validation runs independently.
    needs: snapshot
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  rollback:
    name: Roll back failed checks
    needs: [snapshot, check, deploy]
    if: ${{ !cancelled() && needs.check.result == 'failure' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v2
        with:
          version: 11.5.2
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Restore saved Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION_ID: ${{ needs.snapshot.outputs.version-id }}
          DEPLOYED_VERSION_ID: ${{ needs.deploy.outputs.version-id }}
        run: |
          pnpm exec wrangler deployments status --json > "$RUNNER_TEMP/deployment.json"
          # A rerun of old failed checks must not undo a newer deployment.
          if jq -e --arg version "$DEPLOYED_VERSION_ID" '.versions | length == 1 and .[0].version_id == $version' "$RUNNER_TEMP/deployment.json" > /dev/null; then
            pnpm exec wrangler rollback "$PREVIOUS_VERSION_ID" --yes --message "Checks failed for $GITHUB_SHA"
          else
            echo "Skipping rollback: the deployed Worker version has changed."
          fi
